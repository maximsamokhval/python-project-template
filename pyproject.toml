[project]
name = "python-project-template"
version = "0.1.0"
description = "Reusable Python project template with a development verification harness."
readme = "README.md"
authors = [{ name = "Maxim Samokhval", email = "maxim.samokhval@gmail.com" }]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
lint = ["ruff", "ty", "tach", "pyrefly"]
test = [
  "guardian-type-enforcer",
  "hypothesis",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  "check-jsonschema",
  "detect-secrets",
  "nbstripout",
  "pre-commit",
]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12.12,<0.13"

[tool.ruff]
line-length = 100
indent-width = 4
preview = false
respect-gitignore = true
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "C4",
  "PIE",
  "RET",
  "SIM",
  "PERF",
  "ASYNC",
  "S",
  "PT",
  "DTZ",
  "T10",
  "RUF",
]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.14"
preset = "strict"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = """
-ra
--strict-config
--strict-markers
"""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
xfail_strict = true
markers = [
  "unit: швидкі ізольовані модульні тести",
  "integration: інтеграційні тести з реальними адаптерами або інфраструктурою",
  "contract: перевірка зовнішніх та внутрішніх контрактів",
  "e2e: наскрізні сценарії системи",
  "slow: довгі перевірки, які не запускаються у швидкому циклі",
]

[tool.coverage.run]
branch = true
source = ["src"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.codespell]
skip = """
.git,
.venv,
.ruff_cache,
.pytest_cache,
.hypothesis,
htmlcov,
dist,
build,
uv.lock,
*.svg,
*.min.js,
*.min.css
"""
write-changes = false
